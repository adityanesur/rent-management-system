<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
  <style>
    body { background:#010810; color:white; font-family:'Inter',sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background:rgba(5,16,38,0.95); border-radius:28px; border:1px solid rgba(0,212,255,0.2); padding:2rem; width:350px; }
    input { width:100%; padding:0.8rem; margin:1rem 0; background:rgba(2,10,26,0.8); border:1px solid rgba(0,212,255,0.2); border-radius:12px; color:white; }
    button { width:100%; padding:0.8rem; background:linear-gradient(135deg,#00b7ff,#3e9cff); border:none; border-radius:12px; color:white; font-weight:bold; cursor:pointer; }
    button:hover { transform:translateY(-2px); }
  </style>
</head>
<body>
<div class="card">
  <h2>Set new password</h2>
  <input type="password" id="newPass" placeholder="New password (min 6 characters)">
  <input type="password" id="confirmPass" placeholder="Confirm new password">
  <button id="resetBtn">Reset password</button>
  <p id="msg" style="margin-top:1rem;"></p>
</div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB8FiQNgV8EqhMJEyA5A_ZfmFiZa1Iqm4U",
    authDomain: "rent-management-system-86ccc.firebaseapp.com",
    projectId: "rent-management-system-86ccc"
  };
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.getAuth();

  const urlParams = new URLSearchParams(window.location.search);
  const oobCode = urlParams.get('oobCode');

  if (!oobCode) {
    document.getElementById('msg').innerText = 'Invalid reset link.';
    document.getElementById('resetBtn').disabled = true;
  }

  document.getElementById('resetBtn').addEventListener('click', async () => {
    const newPass = document.getElementById('newPass').value;
    const confirmPass = document.getElementById('confirmPass').value;
    if (newPass.length < 6) {
      document.getElementById('msg').innerText = 'Password must be at least 6 characters.';
      return;
    }
    if (newPass !== confirmPass) {
      document.getElementById('msg').innerText = 'Passwords do not match.';
      return;
    }
    document.getElementById('msg').innerText = 'Resetting...';
    document.getElementById('resetBtn').disabled = true;
    try {
      await auth.confirmPasswordReset(oobCode, newPass);
      document.getElementById('msg').innerText = '✅ Password reset! Redirecting to login...';
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } catch (error) {
      document.getElementById('msg').innerText = '❌ ' + error.message;
      document.getElementById('resetBtn').disabled = false;
    }
  });
</script>
</body>
</html>
