<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#1a7fff"/>
    </linearGradient>
  </defs>

  <!-- Solid background circle for contrast (optional) -->
  <circle cx="50" cy="50" r="48" fill="#030e22" stroke="url(#mainGrad)" stroke-width="4"/>

  <!-- House roof – bold triangle -->
  <polygon points="50,18 78,42 78,50 50,30 22,50 22,42" fill="url(#mainGrad)"/>

  <!-- House body – bold rectangle -->
  <rect x="32" y="50" width="36" height="32" rx="4" fill="none" stroke="url(#mainGrad)" stroke-width="4"/>

  <!-- Door – smaller, filled for contrast -->
  <rect x="42" y="62" width="16" height="20" rx="2" fill="#00d4ff" opacity="0.9"/>

  <!-- "R" letter inside the house (bold) -->
  <text x="50" y="58" font-family="'Syne','Poppins',sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">R</text>

  <!-- Wave flow at bottom – thick -->
  <path d="M 20 88 Q 35 78, 50 88 T 80 88" fill="none" stroke="url(#mainGrad)" stroke-width="5" stroke-linecap="round"/>
</svg>
