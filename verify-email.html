<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying email...</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
  <style>
    body { background:#010810; color:white; font-family: 'Inter', sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background:rgba(5,16,38,0.95); border-radius:28px; border:1px solid rgba(0,212,255,0.2); padding:2rem; text-align:center; max-width:400px; }
    .loader { border:2px solid #00b7ff; border-top:2px solid transparent; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:1rem auto; }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <h2>Verifying your email...</h2>
  <div class="loader"></div>
  <p id="message">Please wait</p>
</div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB8FiQNgV8EqhMJEyA5A_ZfmFiZa1Iqm4U",
    authDomain: "rent-management-system-86ccc.firebaseapp.com",
    projectId: "rent-management-system-86ccc"
  };
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.getAuth();

  const urlParams = new URLSearchParams(window.location.search);
  const mode = urlParams.get('mode');
  const oobCode = urlParams.get('oobCode');

  if (mode === 'verifyEmail' && oobCode) {
    auth.applyActionCode(oobCode).then(() => {
      document.getElementById('message').innerHTML = '✅ Email verified! Redirecting to login...';
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    }).catch((error) => {
      document.getElementById('message').innerHTML = '❌ Verification failed. Link may be expired.';
    });
  } else {
    document.getElementById('message').innerHTML = '❌ Invalid verification link.';
  }
</script>
</body>
</html>
